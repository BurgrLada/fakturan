name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-00
  ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec vitest run --project unit
      - run: pnpm run test:coverage-spec
      - run: pnpm run build
      - run: pnpm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # R-24: six backend shards, each under 170 s locally; the PDF designs run apart.
      - run: pnpm exec vitest run --project backend --shard=${{ matrix.shard }}/6 --exclude tests/backend/pdf-designs.test.ts

  pdf-designs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The per-design blocks are split by the first letter of the design id.
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "registr designů"
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "vizuální regrese"
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "barvy vystaveného dokladu"
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "náhled designu"
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "^design [a-f]"
      - run: pnpm exec vitest run tests/backend/pdf-designs.test.ts -t "^design [g-z]"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker build -t fakturan-ci .
      - run: docker run --rm fakturan-ci node scripts/pdf-smoke.mjs
      - run: pnpm exec playwright test docker-pdf docker-scheduler docker-imap
        env:
          E2E_DOCKER_IMAGE: fakturan-ci
