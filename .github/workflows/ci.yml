name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-00
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run test:coverage-spec
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
      - run: docker build -t fakturan-ci .
      - run: docker run --rm fakturan-ci node scripts/pdf-smoke.mjs
      - run: pnpm exec playwright test docker-pdf docker-scheduler docker-imap
        env:
          E2E_DOCKER_IMAGE: fakturan-ci
